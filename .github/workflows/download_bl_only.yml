name: Download BL Only via Direct Link (No Extract)
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Your Model Number (e.g., SM-G975F)'
        required: true
      samfw_link:
        description: 'Direct download link from samfw.com (or any direct .zip link)'
        required: true
      upload_to_telegram:
        description: 'Upload to Telegram'
        type: boolean
        required: true
        default: false

jobs:
  download-bl-only:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download firmware from direct link
        run: |
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
          mkdir -p Downloads Dist
          echo "[+] Downloading firmware from direct link..."
          curl -L --fail --max-time 3600 "${{ github.event.inputs.samfw_link }}" -o Downloads/firmware.zip || {
            echo "[x] Download failed! Make sure you provided a direct download link."
            exit 1
          }
          echo "[+] Download complete!"
          ls -lh Downloads/

      - name: Extract BL file only from firmware zip
        run: |
          cd Downloads
          echo "[+] Listing contents of firmware.zip..."
          unzip -l firmware.zip | head -30
          echo "[+] Extracting BL*.tar.md5..."
          unzip -j firmware.zip "BL*.tar.md5" -d ../Dist/ || {
            echo "[!] No BL*.tar.md5 found, trying BL* (without .tar.md5)..."
            unzip -j firmware.zip "BL*" -d ../Dist/
          }
          rm -f firmware.zip
          cd ..
          echo "[+] Files in Dist/:"
          ls -la Dist/

      - name: Upload BL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "BL-${{ env.MODEL }}"
          path: Dist/BL*

      - name: Upload BL to GoFile
        run: |
          cd Dist
          for f in BL*; do
            if [ ! -f "$f" ]; then
              echo "[!] No BL file found to upload."
              exit 0
            fi
            echo "[+] Uploading $f to GoFile..."
            SERVER=$(curl -s --max-time 30 https://api.gofile.io/getServer | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['server'])" || echo "")
            if [ -z "$SERVER" ]; then
              echo "[!] Failed to get GoFile server. Skipping upload."
              exit 0
            fi
            RESPONSE=$(curl -s --max-time 300 -X POST "https://$SERVER.gofile.io/uploadFile" -F "file=@$f")
            echo "[+] GoFile response: $RESPONSE"
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage',''))" || echo "")
            if [ -n "$LINK" ]; then
              echo "[+] GoFile Link: $LINK"
              echo "GOLINK=$LINK" >> $GITHUB_ENV
            else
              echo "[!] Failed to get download link from GoFile response."
            fi
          done

      - name: Send Telegram Message
        if: ${{ github.event.inputs.upload_to_telegram == 'true' && env.GOLINK != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            <b>BL Firmware Dump (Direct Link)</b>

            <b>Device:</b> ${{ env.MODEL }}

            <b>Download Link:</b> ${{ env.GOLINK }}

            <b>Powered by:</b> <a href="https://github.com/Only7rb-coder/samloader-actions">samloader-actions</a>
